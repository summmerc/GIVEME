<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>기깔난 신발 사주기</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #fff4e6, #ffe3e3, #f3d9fa);
        overflow: hidden;
      }

      .container {
        width: min(90vw, 700px);
        text-align: center;
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(14px);
        border-radius: 32px;
        padding: 48px 28px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3.2rem);
        color: #3b2f2f;
      }

      p {
        margin: 0 0 36px;
        font-size: 1.1rem;
        color: #5c4d4d;
      }

      .button-area {
        position: relative;
        width: 100%;
        height: 200px;
      }

      button {
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
        font-weight: 700;
      }

      #yesBtn {
        padding: 18px 36px;
        font-size: 1.2rem;
        border-radius: 999px;
        background: #ff6b6b;
        color: white;
        box-shadow: 0 10px 25px rgba(255, 107, 107, 0.35);
      }

      #noBtn {
        position: fixed;
        left: 60%;
        top: 60%;
        padding: 16px 28px;
        font-size: 1rem;
        border-radius: 999px;
        background: white;
        color: #444;
        border: 2px solid #ffd8a8;
      }

      .message {
        margin-top: 20px;
        min-height: 40px;
        font-size: 1.2rem;
        font-weight: 700;
        color: #d9480f;
      }

      .emoji {
        font-size: 4rem;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="emoji">✨👟✨</div>
      <h1>💗욤💗에게 신발 사주기</h1>

      <div class="button-area">
        <button id="yesBtn">Yes! 사줄게 😎</button>
      </div>

      <div class="message" id="message"></div>
    </div>

    <button id="noBtn">No...</button>

    <script>
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");
      const message = document.getElementById("message");

      let moveCount = 0;

      function moveNoButton() {
        const btnRect = noBtn.getBoundingClientRect();

        const maxX = window.innerWidth - btnRect.width;
        const maxY = window.innerHeight - btnRect.height;

        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;

        noBtn.style.left = `${randomX}px`;
        noBtn.style.top = `${randomY}px`;
      }

      noBtn.addEventListener("mouseenter", () => {
        moveNoButton();
        moveCount++;

        const teasingMessages = [
          "그거 아니야",
          "다시 한 번 생각해봐",
          "다시 생각해보라니깐?",
          "ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ",
          "이거 아니야",
          "포기해 그냥 Yes 눌러",
          "No는 허상이다",
          "소용없어",
          "ㅋ ㅋ ㅋ ㅋ ㅋㅋㅋ",
          "yes가 답이야",
          "정말?"
        ];

        message.textContent = teasingMessages[moveCount % teasingMessages.length];
      });

      noBtn.addEventListener("click", (e) => {
        e.preventDefault();
        moveNoButton();
      });

      yesBtn.addEventListener("click", () => {
        message.innerHTML = "<strong>좋아 😆</strong> 역시 종구가 최고얌!";
        yesBtn.textContent = "약속 완료 💖";
        noBtn.style.display = "none";
      });
    </script>
  </body>
</html>
